set_real_ip_from 0.0.0.0/0;

# 使用 Docker 内嵌 DNS，valid=10s 表示每 10 秒重新解析一次
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_unsupported_region $dynamic_backend {
    "true"  app:3000;
    default frontend:3000;
}

server {
    listen 80;
    server_name _;

    # 设置客户端最大请求体大小
    client_max_body_size 100M;

    # API 路由转发到后端
    location /api {
        set $upstream_backend http://app:3000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /image {
        set $upstream_backend http://app:3000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # sitemap.xml 转发到后端
    location = /sitemap.xml {
        set $upstream_backend http://app:3000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt 转发到后端
    location = /robots.txt {
        set $upstream_backend http://app:3000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # rss.xml 转发到后端
    location = /rss.xml {
        set $upstream_backend http://app:3000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        set $upstream_backend http://app:3000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他所有请求转发到前端
    location / {
        set $upstream_dynamic http://$dynamic_backend;
        proxy_pass $upstream_dynamic;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 启用代理缓冲以确保响应头正确返回
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;
        
        # 保留上游服务器的响应头
        proxy_pass_header Content-Type;
        proxy_pass_header Content-Length;
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
        proxy_pass_header Accept-Ranges;
    }

    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 502 "Service temporarily unavailable";
        add_header Content-Type text/plain;
    }
}
